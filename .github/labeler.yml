# Automatic PR labeling configuration

# Documentation
documentation:
  - changed-files:
    - any-glob-to-any-file:
      - 'docs/**/*'
      - '**/*.md'

# Source code
source:
  - changed-files:
    - any-glob-to-any-file: 'frontend/src/**/*'

# Components
components:
  - changed-files:
    - any-glob-to-any-file:
      - 'frontend/src/components/**/*'
      - 'frontend/src/app/**/page.tsx'

# Styles
styles:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.css'

# TypeScript/React
typescript:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.ts'
      - '**/*.tsx'

# Configuration
configuration:
  - changed-files:
    - any-glob-to-any-file:
      - 'frontend/next.config.ts'
      - 'frontend/tsconfig.json'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'frontend/tailwind.config.ts'
      - 'frontend/postcss.config.mjs'
      - 'frontend/components.json'

# GitHub Actions
github-actions:
  - changed-files:
    - any-glob-to-any-file: '.github/workflows/**/*'

# Assets
assets:
  - changed-files:
    - any-glob-to-any-file:
      - 'frontend/public/**/*'

# Data
data:
  - changed-files:
    - any-glob-to-any-file: 'frontend/src/data/**/*'

# i18n dictionaries
i18n:
  - changed-files:
    - any-glob-to-any-file: 'frontend/src/i18n/**/*'

# Hooks
hooks:
  - changed-files:
    - any-glob-to-any-file: 'frontend/src/hooks/**/*'

# UI Components
ui:
  - changed-files:
    - any-glob-to-any-file: 'frontend/src/components/ui/**/*'
